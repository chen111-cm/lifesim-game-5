<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>人生模拟器 · LifeSim Pro</title>
<style>
:root {
  --bg:#0f0f1a; --panel:#1a1a2e; --card:#252540;
  --text:#e8e8f0; --dim:#8888aa; --accent:#4cc9f0;
  --green:#06d6a0; --red:#ef476f; --gold:#ffd166;
  --purple:#9b5de5; --orange:#ff9770; --radius:12px;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;font-size:14px;line-height:1.5;
  user-select:none;-webkit-user-select:none;}
#app{width:100%;height:100%;display:flex;flex-direction:column;max-width:520px;margin:0 auto;position:relative;}
#top-bar{padding:9px 16px;background:var(--panel);border-bottom:1px solid rgba(255,255,255,.05);}
.top-row{display:flex;justify-content:space-between;align-items:center;}
.age-big{font-size:20px;font-weight:bold;color:var(--accent);}
.phase-tag{font-size:11px;background:var(--purple);color:#fff;padding:2px 8px;border-radius:10px;margin-left:8px;}
.money-tag{color:var(--gold);font-weight:bold;font-size:14px;}
.phase-bar{margin-top:5px;}
.phase-bar-track{height:4px;background:var(--card);border-radius:2px;}
.phase-bar-fill{height:100%;background:var(--purple);border-radius:2px;transition:width .5s;}
#char-panel{padding:7px 16px;background:var(--panel);border-bottom:1px solid rgba(255,255,255,.05);}
.stat-row{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px;}
.stat-tag{background:var(--card);padding:2px 8px;border-radius:16px;font-size:11px;color:var(--dim);}
.stat-tag .val{color:var(--text);font-weight:bold;margin-left:3px;}
.stat-tag.hot .val{color:var(--gold);}
.bar-group{display:flex;gap:6px;margin-top:5px;}
.bar-item{flex:1;}
.bar-label{font-size:10px;color:var(--dim);display:flex;justify-content:space-between;}
.bar-track{height:5px;background:var(--card);border-radius:3px;overflow:hidden;}
.bar-fill{height:100%;border-radius:3px;transition:width .4s;}
#main-area{flex:1;overflow-y:auto;padding:12px 16px;-webkit-overflow-scrolling:touch;}
.sec-title{color:var(--dim);font-size:12px;margin:14px 0 6px;display:flex;justify-content:space-between;align-items:center;}
.sec-title:first-child{margin-top:0;}
.choices{display:flex;flex-direction:column;gap:7px;}
.choice-btn{background:var(--card);border:1px solid rgba(255,255,255,.06);color:var(--text);
  padding:10px 12px;border-radius:10px;text-align:left;font-size:13px;cursor:pointer;
  font-family:inherit;transition:.15s;width:100%;}
.choice-btn:active{transform:scale(.98);background:#2f2f52;}
.choice-btn .cost{font-size:11px;color:var(--dim);margin-top:2px;}
.choice-btn.disabled{opacity:.35;pointer-events:none;}
.choice-btn.hi{border-color:var(--gold);}
.choice-btn.ph{border-color:var(--purple);background:#2a2145;}
.msg{background:var(--card);padding:9px 11px;border-radius:9px;font-size:12px;margin-bottom:6px;line-height:1.6;}
.msg .title{font-weight:bold;font-size:13px;margin-bottom:5px;}
.msg.good{border-left:3px solid var(--green);}
.msg.bad{border-left:3px solid var(--red);}
.msg.story{border-left:3px solid var(--gold);}
.msg.event{border-left:3px solid var(--dim);}
.msg.phase-intro{border-left:3px solid var(--accent);background:#1e2a4a;}
.msg.danger{border-left:3px solid var(--red);background:#3a1a26;}
#bottom-bar{padding:9px 12px;background:var(--panel);border-top:1px solid rgba(255,255,255,.05);
  display:flex;gap:7px;align-items:center;}
.btn-primary{flex:1.6;background:var(--accent);color:#0a0a14;border:none;padding:12px;border-radius:10px;
  font-size:15px;font-weight:bold;cursor:pointer;font-family:inherit;}
.btn-primary:active{transform:scale(.98);}
.btn-secondary{flex:1;background:var(--card);color:var(--text);border:none;padding:12px 4px;border-radius:10px;
  font-size:12px;cursor:pointer;font-family:inherit;}
#modal-overlay{position:absolute;inset:0;background:rgba(0,0,0,.72);display:none;
  align-items:center;justify-content:center;padding:20px;z-index:50;}
#modal-overlay.show{display:flex;}
#modal{background:var(--panel);border-radius:16px;padding:18px;max-width:440px;width:100%;
  max-height:82%;overflow-y:auto;}
#modal h3{font-size:16px;margin-bottom:12px;}
#modal .choice-btn{margin-bottom:7px;}
.rel-card{display:flex;align-items:center;gap:10px;background:var(--card);padding:9px 11px;
  border-radius:10px;margin-bottom:7px;}
.rel-avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:18px;flex-shrink:0;}
.rel-info{flex:1;min-width:0;}
.rel-info .name{font-size:13px;font-weight:bold;}
.rel-info .desc{font-size:11px;color:var(--dim);}
.mini-track{height:4px;background:#1a1a2e;border-radius:2px;margin-top:3px;overflow:hidden;}
.mini-fill{height:100%;border-radius:2px;}
.kv{display:flex;justify-content:space-between;margin-bottom:5px;font-size:13px;}
.box{background:var(--card);padding:12px;border-radius:12px;margin-bottom:10px;}
.talent-btn{background:var(--card);border:1px solid rgba(255,255,255,.08);border-radius:12px;
  padding:12px;text-align:left;width:100%;margin-bottom:8px;cursor:pointer;color:var(--text);font-family:inherit;}
.talent-btn:active{border-color:var(--gold);}
.talent-btn .tn{font-size:14px;font-weight:bold;}
.talent-btn .td{font-size:11px;color:var(--dim);margin-top:3px;}
.ach{display:inline-block;background:var(--card);border-radius:8px;padding:4px 8px;font-size:11px;margin:0 5px 5px 0;}
.ach.got{background:#3a3210;color:var(--gold);}
#main-area::-webkit-scrollbar,#modal::-webkit-scrollbar{width:0;}
/* 事业发展卡片 */
.career-card{background:linear-gradient(135deg,#2a2145,#252540);border:1px solid var(--gold);
  border-radius:12px;padding:12px;margin-bottom:12px;position:relative;overflow:hidden;}
.career-card::before{content:"";position:absolute;top:0;left:0;width:4px;height:100%;background:var(--gold);}
.career-head{display:flex;justify-content:space-between;align-items:flex-start;}
.career-title{font-size:15px;font-weight:bold;}
.career-title .track-tag{font-size:10px;padding:1px 6px;border-radius:8px;margin-left:6px;color:#fff;vertical-align:middle;}
.career-sub{font-size:11px;color:var(--dim);margin-top:2px;}
.career-route-link{font-size:11px;color:var(--accent);cursor:pointer;white-space:nowrap;}
.promote-box{margin-top:10px;background:rgba(0,0,0,.2);border-radius:9px;padding:9px 10px;}
.promote-next{font-size:12px;color:var(--text);}
.promote-next b{color:var(--gold);}
.promote-gap{font-size:11px;color:var(--dim);margin-top:3px;}
.promote-btn{display:block;width:100%;margin-top:8px;background:var(--gold);color:#000;border:none;
  padding:10px;border-radius:9px;font-size:14px;font-weight:bold;cursor:pointer;font-family:inherit;
  animation:pulseGold 1.6s infinite;}
.promote-btn:active{transform:scale(.98);}
.seek-btn{display:block;width:100%;margin-top:8px;background:var(--accent);color:#fff;border:none;
  padding:10px;border-radius:9px;font-size:14px;font-weight:bold;cursor:pointer;font-family:inherit;}
@keyframes pulseGold{0%,100%{box-shadow:0 0 0 0 rgba(255,209,102,.5);}50%{box-shadow:0 0 0 6px rgba(255,209,102,0);}}
/* 职业路线图阶梯 */
.track-block{margin-bottom:14px;}
.track-name{font-size:13px;font-weight:bold;margin-bottom:6px;display:flex;align-items:center;gap:6px;}
.ladder-step{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:9px;margin-bottom:5px;
  background:var(--card);border:1px solid transparent;cursor:pointer;}
.ladder-step.locked{opacity:.5;cursor:default;}
.ladder-step.current{border-color:var(--gold);background:#2f2a16;}
.ladder-step.done{opacity:.8;}
.ladder-dot{width:22px;height:22px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;
  justify-content:center;font-size:12px;background:#1a1a2e;color:var(--dim);}
.ladder-step.done .ladder-dot,.ladder-step.current .ladder-dot{background:var(--gold);color:#000;}
.ladder-main{flex:1;min-width:0;}
.ladder-main .ln{font-size:13px;font-weight:bold;}
.ladder-main .lr{font-size:10px;color:var(--dim);margin-top:1px;}
.ladder-sal{font-size:11px;color:var(--gold);white-space:nowrap;}
</style>
</head>
<body>
<div id="app">
  <div id="top-bar"></div>
  <div id="char-panel"></div>
  <div id="main-area"></div>
  <div id="bottom-bar"></div>
</div>
<div id="modal-overlay" onclick="G.closeModal(event)"><div id="modal" onclick="event.stopPropagation()"></div></div>
<script>
/* ============================= 配置 ============================= */
const PHASES = [
  {id:"youth",name:"青春期",from:18,to:22,emoji:"🎓",intro:"18岁,刚步入成年。学历和思维方式在这时奠基。",goal:"考上好大学 / 学到一门硬技能"},
  {id:"hustle",name:"奋斗期",from:23,to:32,emoji:"💼",intro:"23岁,开始职业生涯。拼位置还是攒钱? 每一步都算数。",goal:"攒下 30 万 / 晋升管理层"},
  {id:"family",name:"成家期",from:33,to:45,emoji:"🏡",intro:"33岁,该考虑家庭了。婚姻、孩子、房子...幸福也是负担。",goal:"组建家庭 或 买房"},
  {id:"midlife",name:"中年期",from:46,to:58,emoji:"⚖️",intro:"46岁,人生过半。中年危机来了,但成熟也是财富。",goal:"净资产 100 万 / 家庭美满"},
  {id:"harvest",name:"收获期",from:59,to:80,emoji:"🌴",intro:"59岁,即将退休。回顾一生,你留下了什么?",goal:"安度晚年 / 儿孙满堂"},
];
function phaseOf(age){return PHASES.find(p=>age>=p.from&&age<=p.to)||PHASES[PHASES.length-1];}

/* 职业赛道: 每条赛道由低到高的职位数组,顺序即晋升顺序 */
const CAREER_TRACKS = [
  { id:"tech", name:"技术赛道", emoji:"💻", color:"var(--accent)",
    ladder:[
      {id:"intern",    name:"实习生",     salary:3000,  req:{edu:"high_school"} },
      {id:"coder",     name:"程序员",     salary:15000, req:{edu:"college", skill_code:3} },
      {id:"senior",    name:"高级工程师",  salary:28000, req:{edu:"college", skill_code:6, exp:3} },
      {id:"architect", name:"架构师",     salary:45000, req:{edu:"master", skill_code:9, exp:8} },
      {id:"cto",       name:"技术总监CTO", salary:90000, req:{edu:"master", skill_code:12, skill_social:5, exp:14} },
    ]},
  { id:"design", name:"设计赛道", emoji:"🎨", color:"var(--purple)",
    ladder:[
      {id:"intern",      name:"实习生",     salary:3000,  req:{edu:"high_school"} },
      {id:"designer",    name:"设计师",     salary:12000, req:{edu:"college", skill_art:3} },
      {id:"senior_des",  name:"资深设计师",  salary:25000, req:{edu:"college", skill_art:6, exp:3} },
      {id:"design_lead", name:"设计总监",   salary:48000, req:{edu:"master", skill_art:10, skill_social:4, exp:10} },
    ]},
  { id:"finance", name:"金融赛道", emoji:"📊", color:"var(--gold)",
    ladder:[
      {id:"clerk",    name:"文员",     salary:5000,  req:{edu:"high_school"} },
      {id:"trader",   name:"交易员",   salary:18000, req:{edu:"college", skill_finance:4} },
      {id:"fund_mgr", name:"基金经理", salary:40000, req:{edu:"college", skill_finance:7, exp:5} },
      {id:"partner",  name:"合伙人",   salary:85000, req:{edu:"master", skill_finance:11, skill_social:6, exp:12} },
    ]},
  { id:"manage", name:"管理赛道", emoji:"💼", color:"var(--green)",
    ladder:[
      {id:"clerk",    name:"文员", salary:5000,   req:{edu:"high_school"} },
      {id:"manager",  name:"经理", salary:25000,  req:{edu:"college", skill_social:4, exp:3} },
      {id:"director", name:"总监", salary:45000,  req:{edu:"master", skill_social:7, exp:8} },
      {id:"ceo",      name:"CEO", salary:100000, req:{edu:"master", skill_social:10, skill_finance:5, exp:15} },
    ]},
  { id:"startup", name:"创业赛道", emoji:"🚀", color:"var(--orange)",
    ladder:[
      {id:"startup", name:"创业者", salary:0, req:{skill_social:5, skill_code:3, money:100000} },
    ]},
];

/* 由赛道自动展开合并出 CAREERS(含 none/retired),保证旧存档 s.career 可解析 */
const CAREERS = (()=>{
  const m={ none:{name:"无业",salary:0,req:{}}, retired:{name:"退休",salary:0,req:{}} };
  CAREER_TRACKS.forEach(t=>t.ladder.forEach(j=>{ if(!m[j.id]) m[j.id]={name:j.name,salary:j.salary,req:j.req}; }));
  return m;
})();

/* 定位某职业所属赛道与层级; none/retired/未知 id 返回 null */
function trackOf(careerId){
  if(!careerId||careerId==="none"||careerId==="retired")return null;
  for(const t of CAREER_TRACKS){
    const i=t.ladder.findIndex(j=>j.id===careerId);
    if(i>=0)return {track:t,levelIndex:i,job:t.ladder[i]};
  }
  return null;
}
const EDUCATIONS = {high_school:{name:"高中",years:0,cost:0},college:{name:"本科",years:4,cost:30000},master:{name:"硕士",years:2,cost:50000}};
const SKILL_NAMES = {skill_code:"编程",skill_art:"设计",skill_social:"社交",skill_finance:"理财",skill_fitness:"体力"};
const NAMES_M=["张伟","李明","王磊","刘洋","陈杰","赵鑫","周强","吴昊","孙涛","马超","林凡","徐飞","唐磊","高远"];
const NAMES_F=["小红","小芳","小敏","小丽","小婷","小琳","小雪","小云","小燕","小倩","晓雯","静宜","雨萱","若楠"];
const PERSONALITIES=["温柔","活泼","文艺","事业型","顾家型","冷酷","幽默","神秘"];
function randomName(){return(Math.random()>.5?NAMES_M:NAMES_F)[Math.floor(Math.random()*NAMES_M.length)];}
function randomPersonality(){return PERSONALITIES[Math.floor(Math.random()*PERSONALITIES.length)];}

/* 天赋系统 */
const TALENTS = [
  {id:"rich_kid",name:"🏦 富二代",desc:"起步资金 80000,但心态骄纵 (心情衰减+2)",apply:s=>{s.money=80000;},passive:s=>{s.mood-=2;}},
  {id:"genius",name:"🧠 天才学霸",desc:"起始编程+2/理财+1,但社交-1",apply:s=>{s.skills.skill_code+=2;s.skills.skill_finance++;s.skills.skill_social=0;}},
  {id:"athlete",name:"🏃 运动天赋",desc:"体力+3,每年额外+5 健康,但初始钱少",apply:s=>{s.skills.skill_fitness+=3;s.money=2000;}},
  {id:"social_butterfly",name:"🦋 社交达人",desc:"社交+3,恋爱亲密度增幅翻倍,但学习 -1",apply:s=>{s.skills.skill_social+=3;}},
  {id:"lucky",name:"🍀 欧皇",desc:"好事件出现概率 +50%",apply:()=>{}},
  {id:"hard_mode",name:"☠️ 困难模式",desc:"初始钱 0,健康 60,但通关评价 x2",apply:s=>{s.money=0;s.health=60;}},
];

/* 成就系统 */
const ACHIEVEMENTS = [
  {id:"millionaire",name:"百万富翁",desc:"净资产达到 100 万",check:s=>(s.money+s.stocks+s.assets)>=1000000},
  {id:"married",name:"执子之手",desc:"结婚",check:s=>s.relations.some(r=>r.type==="spouse")},
  {id:"parent",name:"为人父母",desc:"有孩子",check:s=>s.flags.hasChild},
  {id:"ceo_life",name:"走上巅峰",desc:"成为 CEO",check:s=>s.career==="ceo"},
  {id:"fitness10",name:"健身狂魔",desc:"体力达到 10",check:s=>(s.skills.skill_fitness||0)>=10},
  {id:"startup_ok",name:"创业成功",desc:"创业公司估值达 100 万",check:s=>s.flags.startupVal>=1000000},
  {id:"world_tour",name:"环游世界",desc:"花 10 万环游世界",check:s=>s.flags.worldTour},
  {id:"retire_early",name:"提前退休",desc:"50 岁前退休",check:s=>s.flags.retired&&s.age<=50},
];

/* ============================= 事件池 (100+) ============================= */
// once:true 表示一次性事件,触发后不再出现
const EVENTS = [
/* -------- 青春期 youth -------- */
{phase:"youth",text:"期末考试临近,室友叫你通宵打游戏",type:"story",weight:3,
  choices:[
    {text:"📚 拒绝复习",effects:s=>{s.skills.skill_code++;s.mood-=5;}},
    {text:"🎮 玩! 年轻不疯狂枉少年",effects:s=>{s.mood+=15;s.skills.skill_social++;}},
  ]},
{phase:"youth",text:"社团招新,加入哪个?",type:"story",weight:3,once:true,
  choices:[
    {text:"💻 编程社",effects:s=>{s.skills.skill_code+=2;}},
    {text:"🎨 美术社",effects:s=>{s.skills.skill_art+=2;}},
    {text:"🎤 辩论社",effects:s=>{s.skills.skill_social+=2;}},
    {text:"🏀 篮球社",effects:s=>{s.skills.skill_fitness+=2;s.mood+=10;}},
  ]},
{phase:"youth",text:"暑假到了,怎么过?",type:"story",weight:3,
  choices:[
    {text:"💼 打工 (+5000)",effects:s=>{s.money+=5000;s.mood-=5;}},
    {text:"✈️ 旅行 (-2000)",effects:s=>{s.mood+=20;s.skills.skill_social++;s.money-=2000;}},
    {text:"📖 报班学习",effects:s=>{s.skills.skill_finance++;s.skills.skill_code++;}},
  ]},
{phase:"youth",text:"有出国交换的机会,但要花 20000",type:"story",weight:2,cond:s=>s.money>=20000,once:true,
  choices:[
    {text:"🌍 去! 开阔眼界",effects:s=>{s.money-=20000;s.skills.skill_social+=2;s.skills.skill_finance++;s.mood+=15;}},
    {text:"🏠 留在国内",effects:()=>{}},
  ]},
{phase:"youth",text:"你在食堂捡到 500 元",type:"good",weight:1,effects:s=>{s.money+=500;}},
{phase:"youth",text:"熬夜太多,身体亮红灯",type:"bad",weight:2,effects:s=>{s.health-=10;}},
{phase:"youth",text:"参加编程比赛拿了奖! 编程 +2, 奖金 3000",type:"good",weight:1,cond:s=>s.skills.skill_code>=2,effects:s=>{s.skills.skill_code+=2;s.money+=3000;}},
{phase:"youth",text:"表白暗恋对象",type:"story",weight:2,cond:s=>!s.partner&&s.age<=22,
  choices:[
    {text:"❤️ 鼓起勇气",effects:s=>{if(Math.random()*10<s.skills.skill_social+3){s.partner={name:randomName(),personality:randomPersonality(),closeness:55,emoji:"😊"};msg("成功了! 有了初恋 💕","good");}else{s.mood-=10;msg("被拒绝了,心情低落","bad");}}},
    {text:"😔 默默藏在心里",effects:s=>{s.mood-=3;}},
  ]},
{phase:"youth",text:"迷茫期,不知道未来干什么",type:"story",weight:2,
  choices:[
    {text:"📚 请教前辈",effects:s=>{s.skills.skill_social++;s.mood+=5;}},
    {text:"💤 摆烂几天",effects:s=>{s.mood+=8;s.health-=5;}},
  ]},
{phase:"youth",text:"骑车摔了一跤,擦伤",type:"bad",weight:1,effects:s=>{s.health-=5;s.money-=200;}},
{phase:"youth",text:"帮学弟学妹辅导功课,收获感谢",type:"good",weight:1,cond:s=>s.skills.skill_code>=2||s.skills.skill_finance>=2,effects:s=>{s.mood+=8;s.skills.skill_social++;s.money+=1000;}},
{phase:"youth",text:"发现一位神秘导师,愿意教你",type:"story",weight:1,once:true,
  choices:[
    {text:"💻 编程大牛",effects:s=>{s.skills.skill_code+=3;}},
    {text:"💰 投资高手",effects:s=>{s.skills.skill_finance+=3;}},
    {text:"🎨 艺术家",effects:s=>{s.skills.skill_art+=3;}},

const SAVE_KEY = "lifesim_pro_v4";
function save(){try{S.savedAt=Date.now();localStorage.setItem(SAVE_KEY,JSON.stringify(S));}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem(SAVE_KEY)||"null");if(d&&d.age!==undefined)return d;}catch(e){}return null;}
let S = load() || newState();

const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
const rand=(a,b)=>a+Math.random()*(b-a);
const fmtMoney=n=>{const sign=n<0?"-":"";n=Math.abs(n);if(n>=100000000)return sign+(n/100000000).toFixed(2)+"亿";if(n>=10000)return sign+(n/10000).toFixed(1)+"万";return sign+Math.round(n).toLocaleString();};
function msg(text,type){S.messages.unshift({text,type:type||"info",age:S.age});if(S.messages.length>30)S.messages.length=30;if(type==="story"||type==="danger"||type==="phase-intro")S.history.unshift({text,type:type||"info",age:S.age});}
function hasSpouseOrLover(s){return s.relations.some(r=>r.type==="spouse"||r.type==="lover");}

/* ============================= 职业逻辑 ============================= */
function meetsReq(s,req){
  if(!req)return true;
  if(req.edu){const o=["high_school","college","master"];if(o.indexOf(s.edu)<o.indexOf(req.edu))return false;}
  for(const k in req){
    if(k==="edu")continue;
    if(k==="money"){if(s.money<req[k])return false;continue;}
    if(k==="exp"){if(s.exp<req[k])return false;continue;}
    if((s.skills[k]||0)<req[k])return false;
  }
  return true;
}
function availableCareers(s){
  return Object.entries(CAREERS).filter(([id,c])=>id!=="none"&&id!=="retired"&&meetsReq(s,c.req)).map(([id,c])=>({id,...c}));
}
function applyJob(id){
  const c=CAREERS[id];if(!c)return;
  if(id!=="none"&&!meetsReq(S,c.req)){msg("条件不足,应聘失败","bad");G.render();return;}
  if(id==="startup"){
    S.money-=100000;
    S.startup={name:randomName()+"科技",valuation:100000,level:1,foundedAt:S.age};
    S.career="startup";S.salary=0;
    msg(`🚀 创立了 ${S.startup.name}! 初始估值 10万。用"经营公司"行动来发展它`,"story");
    G.render();return;
  }
  S.career=id;S.salary=c.salary;
  msg(id==="none"?"你辞职了":`成为了 ${c.name} (月薪 ${fmtMoney(c.salary)})`,id==="none"?"info":"good");
  G.render();
}
function reqDesc(req){
  if(!req||!Object.keys(req).length)return "无门槛";
  const p=[];if(req.edu)p.push(EDUCATIONS[req.edu]?.name);
  for(const k in req){
    if(k==="edu")continue;
    if(k==="money"){p.push(`资金${fmtMoney(req[k])}`);continue;}
    if(k==="exp"){p.push(`经验${req[k]}年`);continue;}
    p.push(`${SKILL_NAMES[k]}≥${req[k]}`);
  }
  return "要求: "+p.join(", ");
}
function relTypeName(t){return{family:"家人",lover:"恋人",spouse:"配偶",child:"孩子",friend:"朋友"}[t]||t;}

/* 晋升逻辑 */
function nextPromotion(s){
  const t=trackOf(s.career);
  if(!t)return null;                                   // 无业/退休/创业(单级)等
  if(t.levelIndex>=t.track.ladder.length-1)return null; // 已封顶
  return {track:t.track, job:t.track.ladder[t.levelIndex+1]};
}
function canPromote(s){const n=nextPromotion(s);return !!n&&meetsReq(s,n.job.req);}
function gapDesc(s,job){
  if(!job||!job.req)return "";
  const p=[];
  const o=["high_school","college","master"];
  if(job.req.edu&&o.indexOf(s.edu)<o.indexOf(job.req.edu))p.push(`需${EDUCATIONS[job.req.edu]?.name}`);
  for(const k in job.req){
    if(k==="edu")continue;
    if(k==="money"){if(s.money<job.req[k])p.push(`资金差${fmtMoney(job.req[k]-s.money)}`);continue;}
    if(k==="exp"){if(s.exp<job.req[k])p.push(`经验差${job.req[k]-s.exp}年`);continue;}
    const cur=s.skills[k]||0;if(cur<job.req[k])p.push(`${SKILL_NAMES[k]}差${job.req[k]-cur}`);
  }
  return p.length?("还差: "+p.join(", ")):"条件已满足";
}

      <div class="career-head">

        <div class="career-route-link" onclick="G.showCareer()">职业路线 ›</div>
      </div>
      ${body}
    </div>`;
  },

  renderPending(){
    const e=S.pendingEvent;
    const isCareer=!!e.career;
    const titleTxt=isCareer?`💼 ${S.age}岁 · 职业抉择`:`🎭 ${S.age}岁 · 抉择`;
    let html=`<div class="msg ${isCareer?'phase-intro':'story'}"><div class="title">${titleTxt}</div><div>${e.text}</div><div class="choices" style="margin-top:8px;">`;
    if(e.choices)e.choices.forEach((c,i)=>{html+=`<button class="choice-btn ${isCareer?'ph':''}" onclick="G.chooseEvent(${i})">${c.text}</button>`;});
    else html+=`<button class="choice-btn" onclick="G.chooseEvent(-1)">继续</button>`;
    html+=`</div></div>`;
    return html;
  },

  renderBottom(){
    document.getElementById("bottom-bar").innerHTML=`
      <button class="btn-secondary" onclick="G.showRelations()">👥 关系</button>
      <button class="btn-secondary" onclick="G.showFinance()">📊 财务</button>
      <button class="btn-primary" onclick="G.nextYear()">${S.ended?'🔄 重开':'⏭️ 下一年'}</button>`;
  },

  renderEnd(){
    const net=this.netWorth();
    let rank="😐 平凡的一生",color="var(--dim)";
    const mul=S.talent==="hard_mode"?2:1;
    const score=(net/10000+S.mood+S.health)*mul;
    if(score>=1500){rank="🏆 传奇人生";color="var(--gold)";}
    else if(score>=800){rank="🥇 事业有成";color="var(--gold)";}
    else if(score>=400){rank="🥈 小康之家";color="var(--accent)";}
    else if(score>=150){rank="🥉 温饱有余";color="var(--green)";}
    else if(net<0){rank="💸 负债离场";color="var(--red)";}
    const sp=S.relations.find(r=>r.type==="spouse");
    const kids=S.relations.filter(r=>r.type==="child").length;
    const achGot=ACHIEVEMENTS.filter(a=>S.achievements.includes(a.id));
    return `<div class="msg" style="text-align:center;padding:22px;">
      <div style="font-size:26px;margin-bottom:10px;">🎬 人生落幕</div>
      <div style="color:var(--dim);margin-bottom:14px;">${S.endReason||"你走完了这一生"}</div>
      <div style="font-size:20px;font-weight:bold;color:${color};margin-bottom:14px;">${rank}</div>
      <div style="text-align:left;background:var(--card);padding:14px;border-radius:12px;font-size:13px;line-height:1.8;">
        📊 <b>人生总结 (${S.age}岁)</b><br>
        · 最终身家: <span style="color:var(--gold);">${fmtMoney(net)}</span><br>
        · 最高职位: ${CAREERS[S.career]?.name}<br>
        · 学历: ${EDUCATIONS[S.edu]?.name}<br>
        · 婚姻: ${sp?`与 ${sp.name} 相伴`:"孑然一身"}<br>
        · 子女: ${kids} 个<br>
        · 健康 ${Math.round(S.health)} · 心情 ${Math.round(S.mood)}<br>
        · 综合评分: <b style="color:${color};">${Math.round(score)}</b><br>
      </div>
      <div style="text-align:left;margin-top:12px;">🏅 <b>成就 (${achGot.length}/${ACHIEVEMENTS.length})</b><br>
        ${ACHIEVEMENTS.map(a=>`<span class="ach ${S.achievements.includes(a.id)?'got':''}">${S.achievements.includes(a.id)?'✓':'○'} ${a.name}</span>`).join('')}
      </div>
      <button class="choice-btn" style="margin-top:14px;text-align:center;background:var(--accent);color:#fff;" onclick="G.showReview()">📖 查看人生回顾</button>
      <button class="choice-btn" style="margin-top:6px;text-align:center;background:var(--gold);color:#000;" onclick="G.restart()">🔄 再活一次</button>
    </div>`;
  },
  doAction(id){
    if(S.ended||S.pendingEvent)return;
    const a=ACTIONS.find(x=>x.id===id);if(!a)return;
    if(S.ap<a.ap){msg("行动点不够!","bad");this.render();return;}
    if(a.cost&&S.money<a.cost){msg("钱不够!","bad");this.render();return;}
    if(a.cond&&!a.cond(S)){msg("条件不满足","bad");this.render();return;}
    S.ap-=a.ap; a.perform(S);
    this.checkAchievements();
    this.render();
  },

  nextYear(){
    if(S.ended){this.restart();return;}
    if(S.pendingEvent){msg("请先处理当前抉择","bad");this.render();return;}
    this.advanceYear();
  },

  advanceYear(){
    const oldPhase=phaseOf(S.age).id;
    S.age++;
    // 收支
    S.money+=(S.salary-S.monthlyExpense)*12;
    if(S.career!=="none"&&S.career!=="retired")S.exp++;
    // 基金: 理财技能挂钩收益率与波动
    if(S.stocks>0){
      const fin=S.skills.skill_finance||0;
      const base=0.02+fin*0.015;          // 理财越高,期望收益越高
      const vol=Math.max(0.05,0.22-fin*0.02); // 理财越高,波动越小
      const ret=base+rand(-vol,vol);
      const before=S.stocks;
      S.stocks=Math.max(0,Math.round(S.stocks*(1+ret)));
      const diff=S.stocks-before;
      if(Math.abs(diff)>=2000)msg(`基金年度${diff>=0?'收益':'亏损'} ${fmtMoney(Math.abs(diff))} (理财Lv${fin})`,diff>=0?"good":"bad");
    }
    if(S.flags.hasHouse)S.assets=Math.round(S.assets*1.02);
    // 创业公司自然波动(不经营则缓慢缩水)
    if(S.startup){ S.startup.valuation=Math.max(0,Math.round(S.startup.valuation*rand(0.95,1.05))); if(S.startup.valuation<=0){S.startup=null;S.career="none";S.salary=0;S.flags.startupFailed=true;msg("⚠️ 公司资金链断裂,倒闭了","danger");}}
    // 心情自然衰减(天赋/家庭联动)
    let moodDecay=4;
    if(S.talent==="rich_kid")moodDecay+=2;
    // 家人冷淡拉低心情,和睦提升心情
    const fam=S.relations.filter(r=>r.type==="family"||r.type==="child"||r.type==="spouse");
    if(fam.length){
      const avg=fam.reduce((a,r)=>a+r.closeness,0)/fam.length;
      if(avg<30){moodDecay+=4;msg("家人关系冷淡,心里不是滋味","bad");}
      else if(avg>=75)moodDecay-=3;
    }
    S.mood=clamp(S.mood-moodDecay,0,100);
    // 健康衰减(体力抗衰老)
    const fit=S.skills.skill_fitness||0;
    let hpDecay=0;
    if(S.age>45)hpDecay+=2; if(S.age>60)hpDecay+=3; if(S.age>75)hpDecay+=5;
    hpDecay=Math.max(0,hpDecay-Math.floor(fit/3));  // 体力每3点减1衰减
    if(S.talent==="athlete")S.health=clamp(S.health+5,0,100);
    S.health=clamp(S.health-hpDecay,0,100);
    // 关系自然疏远
    S.relations.forEach(r=>r.closeness=clamp(r.closeness-3,0,100));
    if(S.partner)S.partner.closeness=clamp(S.partner.closeness-5,0,100);
    // 家人年龄增长 + 高龄离世(父母)
    S.relations.filter(r=>r.type==="family").forEach(r=>{ if(r.age!==undefined)r.age++; });
    // 行动点(体力提升上限)
    S.apMax=(S.age>=65?6:(S.age>=45?8:10))+Math.floor(fit/5);
    S.ap=S.apMax;
    // 阶段切换
    const np=phaseOf(S.age);
    if(np.id!==oldPhase)this.startPhase(np);
    // 事件
    this.rollEvent();
    this.checkAchievements();
    this.checkEnd();
    this.render();
  },

  rollEvent(){
    const ph=phaseOf(S.age).id;
    let pool=EVENTS.filter(e=>(e.phase===ph||e.phase==="any")&&(!e.cond||e.cond(S))&&!(e.once&&S.seenOnce[e.text]));
    if(!pool.length)return;
    // 欧皇天赋: 好事件权重翻倍
    const total=pool.reduce((a,e)=>a+((e.weight||1)*((S.talent==="lucky"&&e.type==="good")?2:1)),0);
    let r=Math.random()*total;
    for(const e of pool){
      r-=(e.weight||1)*((S.talent==="lucky"&&e.type==="good")?2:1);
      if(r<=0){
        if(e.once)S.seenOnce[e.text]=true;
        if(e.choices)S.pendingEvent=e;
        else{e.effects&&e.effects(S);msg(e.text,e.type||"event");}
        return;
      }
    }
  },

  chooseEvent(i){
    const e=S.pendingEvent;if(!e)return;
    if(i===-1){e.effects&&e.effects(S);msg(e.text,e.type||"event");}
    else if(e.choices&&e.choices[i]){e.choices[i].effects(S);msg(`${e.text} → ${e.choices[i].text}`,"story");}
    S.pendingEvent=null;
    this.checkAchievements();
    this.checkEnd();
    this.render();
  },

  checkAchievements(){
    ACHIEVEMENTS.forEach(a=>{
      if(!S.achievements.includes(a.id)&&a.check(S)){
        S.achievements.push(a.id);
        msg(`🏅 达成成就: ${a.name}`,"story");
      }
    });
  },

  checkEnd(){
    if(S.health<=0){S.ended=true;S.endReason="健康耗尽,你病倒了...";return;}
    if(S.mood<=0){S.ended=true;S.endReason="你陷入了深深的抑郁...";return;}
    if(S.money<-500000){S.ended=true;S.endReason="债台高筑,无力回天...";return;}
    if(S.age>=80){S.ended=true;S.endReason="80岁,你安详地回顾了这一生";return;}
    const net=this.netWorth();
    if(net>=3000000&&S.age>=40&&S.mood>=60&&!S.flags.freeHinted){
      S.flags.freeHinted=true;
      msg("🎉 你已财务自由! 可继续生活,或在'事业'里'提前退休'完美通关",void 0);
    }
  },

  autoRetire(){
    this.openModal(`<h3>⏩ 快进余生</h3><p style="color:var(--dim);">将自动度过到 80 岁(或直到人生结束),期间事件自动处理。确定吗?</p><div style="display:flex;gap:10px;margin-top:16px;"><button class="choice-btn" style="flex:1;background:var(--accent);color:#fff;" onclick="G.doAutoRetire()">确定快进</button><button class="choice-btn" style="flex:1;" onclick="G.closeModal()">取消</button></div>`);
  },
  doAutoRetire(){
    this.closeModal();
    if(!S.flags.retired){S.career="retired";S.salary=0;S.flags.retired=true;}
    let guard=0;
    while(!S.ended&&S.age<80&&guard<100){
      guard++;
      // 自动处理: 优先健身/休息保命
      const oldPhase=phaseOf(S.age).id;
      S.age++;
      S.money+=(S.salary-S.monthlyExpense)*12;
      if(S.stocks>0){const fin=S.skills.skill_finance||0;S.stocks=Math.max(0,Math.round(S.stocks*(1+0.02+fin*0.01+rand(-0.1,0.1))));}
      S.mood=clamp(S.mood-2,0,100); // 退休后心情衰减慢
      const fit=S.skills.skill_fitness||0;
      let hp=0;if(S.age>60)hp+=3;if(S.age>75)hp+=5;hp=Math.max(0,hp-Math.floor(fit/3));
      S.health=clamp(S.health-hp+2,0,100); // 安逸+2
      const np=phaseOf(S.age);if(np.id!==oldPhase)this.startPhase(np);
      // 只处理无选择事件
      const ph=phaseOf(S.age).id;
      const pool=EVENTS.filter(e=>(e.phase===ph||e.phase==="any")&&!e.choices&&(!e.cond||e.cond(S))&&!(e.once&&S.seenOnce[e.text]));
      if(pool.length&&Math.random()<0.6){const e=pool[Math.floor(Math.random()*pool.length)];if(e.once)S.seenOnce[e.text]=true;e.effects&&e.effects(S);msg(e.text,e.type||"event");}
      this.checkEnd();
    }
    if(!S.ended){S.ended=true;S.endReason="你安然度过了晚年,寿终正寝";}
    this.checkAchievements();
    this.render();
  },
  promote(){
    if(S.ended||S.pendingEvent)return;
    const n=nextPromotion(S);
    if(!n){msg("当前已无可晋升职位","bad");this.render();return;}
    if(S.ap<1){msg("行动点不够,无法争取晋升!","bad");this.render();return;}
    if(!meetsReq(S,n.job.req)){msg(`晋升条件不足: ${gapDesc(S,n.job)}`,"bad");this.render();return;}
    S.ap-=1;
    S.career=n.job.id;S.salary=n.job.salary;
    msg(`🎉 晋升成功! 你成为了 ${n.job.name} (月薪 ${fmtMoney(n.job.salary)})`,"story");
    this.checkAchievements();
    this.closeModal();
    this.render();
  },
  showCareer(){
    const t=trackOf(S.career);
    let html=`<h3>💼 职业发展路线</h3>`;
    // 当前职业状态条
    const curName=CAREERS[S.career]?.name||"无业";
    const curTrackName=t?t.track.name:(S.career==="startup"?"创业赛道":(S.career==="retired"?"已退休":"待就业"));
    html+=`<div class="box" style="margin-bottom:12px;">
      <div class="kv"><span>当前职位</span><b>${curName}</b></div>
      <div class="kv"><span>所在赛道</span><b>${curTrackName}</b></div>
      <div class="kv"><span>月薪 / 经验</span><b style="color:var(--gold);">${fmtMoney(S.salary)} · ${S.exp}年</b></div>
    </div>`;
    html+=`<div style="color:var(--dim);font-size:11px;margin-bottom:10px;">💡 同赛道逐级晋升(满足条件即可),也可跨赛道应聘已达标的职位。</div>`;
    // 按赛道渲染晋升阶梯
    CAREER_TRACKS.forEach(tr=>{
      html+=`<div class="track-block"><div class="track-name"><span style="color:${tr.color};">${tr.emoji} ${tr.name}</span></div>`;
      tr.ladder.forEach((job,idx)=>{
        const isCurrent=S.career===job.id&&(!t||t.track.id===tr.id);
        const reached=t&&t.track.id===tr.id&&idx<=t.levelIndex;
        const ok=meetsReq(S,job.req);
        // 可点击条件: 当前赛道的下一级(晋升) 或 任意达标且非当前的职位(应聘)
        const isNextInTrack=t&&t.track.id===tr.id&&idx===t.levelIndex+1;
        const clickable=!isCurrent&&ok&&(isNextInTrack||!(t&&t.track.id===tr.id&&idx<=t.levelIndex));
        let cls="ladder-step";
        if(isCurrent)cls+=" current";else if(reached)cls+=" done";else if(!ok)cls+=" locked";
        let dot=reached?"✓":(idx+1);
        let onclick="";
        if(clickable){
          onclick = isNextInTrack ? `onclick="G.promote()"` : `onclick="applyJob('${job.id}');G.closeModal()"`;
        }
        const rightTxt=isCurrent?"当前":(reached?"已过":(ok?(isNextInTrack?"可晋升 ⬆️":"可应聘"):gapDesc(S,job)));
        html+=`<div class="${cls}" ${onclick}>
          <div class="ladder-dot">${dot}</div>
          <div class="ladder-main"><div class="ln">${job.name}</div><div class="lr">${rightTxt}</div></div>
          <div class="ladder-sal">${job.salary>0?fmtMoney(job.salary)+'/月':'—'}</div>
        </div>`;
      });
      html+=`</div>`;
    });
    html+=`<div style="margin-top:4px;padding-top:12px;border-top:1px solid rgba(255,255,255,.1);color:var(--dim);font-size:12px;margin-bottom:8px;">深造:</div>`;
    if(S.edu==="high_school"){
      const cost=EDUCATIONS.college.cost,ok=S.money>=cost;
      html+=`<button class="choice-btn ${ok?'':'disabled'}" onclick="G.enroll('college')"><div><b>📖 读大学</b> ·4年·${fmtMoney(cost)}</div><div class="cost">${ok?'技能+3, 解锁高薪职业':`❌ 学费不足(当前${fmtMoney(S.money)})`}</div></button>`;
      if(!ok)html+=`<button class="choice-btn" onclick="G.enrollLoan('college')"><div><b>🏦 助学贷款读大学</b></div><div class="cost">立即入学,月供+1000(10年)</div></button>`;
    }
    if(S.edu==="college"){
      const cost=EDUCATIONS.master.cost,ok=S.money>=cost;
      html+=`<button class="choice-btn ${ok?'':'disabled'}" onclick="G.enroll('master')"><div><b>📖 读硕士</b> ·2年·${fmtMoney(cost)}</div><div class="cost">${ok?'编程+2,理财+1':`❌ 学费不足(当前${fmtMoney(S.money)})`}</div></button>`;
    }
    if(S.career!=="none"&&S.career!=="retired")html+=`<button class="choice-btn" onclick="applyJob('none');G.closeModal()"><div><b>🚪 辞职</b></div></button>`;
    if(S.age>=50)html+=`<button class="choice-btn" onclick="G.retire()"><div><b>🌴 退休</b></div><div class="cost">停止工作,安享晚年</div></button>`;
    const net=this.netWorth();
    if(net>=3000000&&S.age>=40)html+=`<button class="choice-btn hi" onclick="G.finishGame()"><div><b>🏆 提前退休,财务自由</b></div><div class="cost">以完美结局结束游戏</div></button>`;
    this.openModal(html);
  },

  enroll(edu){const e=EDUCATIONS[edu];if(S.money<e.cost){msg("学费不够!","bad");this.render();return;}S.money-=e.cost;S.edu=edu;S.age+=e.years;if(edu==="college"){S.skills.skill_code++;S.skills.skill_finance++;S.skills.skill_social++;}if(edu==="master"){S.skills.skill_code+=2;S.skills.skill_finance++;}msg(`完成${e.name}学业(${e.years}年)`,"good");this.closeModal();this.render();},
  enrollLoan(edu){const e=EDUCATIONS[edu];S.edu=edu;S.age+=e.years;S.monthlyExpense+=1000;if(edu==="college"){S.skills.skill_code++;S.skills.skill_finance++;S.skills.skill_social++;}msg(`助学贷款完成${e.name}(月供+1000)`,"good");this.closeModal();this.render();},
  retire(){S.career="retired";S.salary=0;S.flags.retired=true;msg("你退休了! 🌴","story");this.closeModal();this.render();},
  finishGame(){S.ended=true;S.endReason="你选择在人生巅峰急流勇退,享受自由人生";this.closeModal();this.render();},

  showRelations(){
    let html=`<h3>👥 人际关系</h3>`;
    html+=`<div style="color:var(--dim);font-size:11px;margin-bottom:10px;">💡 亲密度低于30→心情持续下降 | 高于75→心情自动恢复</div>`;
    if(S.partner)html+=`<div class="rel-card"><div class="rel-avatar" style="background:var(--orange);">😊</div><div class="rel-info"><div class="name">${S.partner.name} <span style="color:var(--dim);">(暧昧中)</span></div><div class="desc">${S.partner.personality}型 · 亲密度 ${S.partner.closeness}<div class="mini-track"><div class="mini-fill" style="width:${S.partner.closeness}%;background:var(--orange);"></div></div></div></div></div>`;
    S.relations.forEach(r=>{
      const col=r.type==='spouse'?'var(--red)':r.type==='lover'?'var(--purple)':r.type==='child'?'var(--green)':'var(--dim)';
      html+=`<div class="rel-card"><div class="rel-avatar" style="background:${col};">${r.emoji}</div><div class="rel-info"><div class="name">${r.name} <span style="color:var(--dim);font-size:11px;">${relTypeName(r.type)}${r.age!==undefined?' · '+r.age+'岁':''}</span></div><div class="desc"><div class="mini-track"><div class="mini-fill" style="width:${r.closeness}%;background:${col};"></div></div>亲密度 ${r.closeness}</div></div></div>`;
    });
    if(!S.partner&&!S.relations.some(r=>r.type==="lover"||r.type==="spouse"))html+=`<div style="color:var(--dim);font-size:12px;margin-top:8px;">💡 用'相亲/认识新人'开始脱单</div>`;
    this.openModal(html);
  },

  showFinance(){
    const net=this.netWorth();
    const fin=S.skills.skill_finance||0;
    this.openModal(`<h3>📊 财务状况</h3>
      <div class="box">
        <div class="kv"><span>💵 现金</span><b>${fmtMoney(S.money)}</b></div>
        <div class="kv"><span>📈 基金</span><b>${fmtMoney(S.stocks)}</b></div>
        <div class="kv"><span>🏠 资产</span><b>${fmtMoney(S.assets)}</b></div>
        ${S.startup?`<div class="kv"><span>🚀 公司(${S.startup.name})</span><b>${fmtMoney(S.startup.valuation)}</b></div>`:''}
        <hr style="border-color:rgba(255,255,255,.1);margin:6px 0;">
        <div class="kv" style="font-size:15px;"><span>净资产</span><b style="color:var(--gold);">${fmtMoney(net)}</b></div>
      </div>
      <div class="box">
        <div class="kv" style="color:var(--green);"><span>月收入</span><b>+${fmtMoney(S.salary)}</b></div>
        <div class="kv" style="color:var(--red);"><span>月支出</span><b>-${fmtMoney(S.monthlyExpense)}</b></div>
        <div class="kv"><span>年净收入</span><b style="color:${(S.salary-S.monthlyExpense)>=0?'var(--green)':'var(--red)'};">${fmtMoney((S.salary-S.monthlyExpense)*12)}</b></div>
      </div>
      <div class="box" style="font-size:12px;color:var(--dim);">
        📈 <b>理财技能 Lv${fin}</b> 效果:<br>
        · 基金期望收益: <span style="color:var(--green);">+${((0.02+fin*0.015)*100).toFixed(1)}%/年</span><br>
        · 波动幅度: ±${((Math.max(0.05,0.22-fin*0.02))*100).toFixed(1)}%<br>
        · 提升理财技能可降低风险、提高收益<br>
        <br>
        💡 净资产300万+且40岁+且心情≥60 → 可提前退休通关
      </div>`);
  },

  showReview(){
    let html=`<h3>📖 人生回顾</h3>`;
    if(!S.history.length){html+=`<div style="color:var(--dim);font-size:12px;">暂无重大事件记录</div>`;}
    else S.history.forEach(h=>{
      const cls=h.type==="good"?"good":h.type==="bad"?"bad":h.type==="danger"?"danger":"story";
      html+=`<div class="msg ${cls}" style="font-size:11px;">[${h.age}岁] ${h.text.replace(/\n/g,'<br>')}</div>`;
    });
    this.openModal(html);
  },

  openModal(html){document.getElementById("modal").innerHTML=html;document.getElementById("modal-overlay").classList.add("show");},
  closeModal(e){if(e&&e.target!==document.getElementById("modal-overlay"))return;document.getElementById("modal-overlay").classList.remove("show");},
  restart(){this.openModal(`<h3>🔄 重新开始</h3><p style="color:var(--dim);">确定重新开始一段全新的人生吗?<br>当前存档将被清除。</p><div style="display:flex;gap:10px;margin-top:16px;"><button class="choice-btn" style="flex:1;background:var(--red);color:#fff;" onclick="G.doRestart()">确定重来</button><button class="choice-btn" style="flex:1;" onclick="G.closeModal()">取消</button></div>`);},
  doRestart(){localStorage.removeItem(SAVE_KEY);S=newState();this.closeModal();this.showTalentPick();},
};

G.init();
</script>
</body>
</html>
